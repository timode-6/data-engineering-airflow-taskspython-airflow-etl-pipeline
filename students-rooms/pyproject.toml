[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hostel-report"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.scripts]
hostel-report = "hostel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hostel = ["sql/*.sql"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 105
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
